name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Self-check
        run: swift run diffkit-selfcheck

      # -O compiles asserts out; the self-check must refuse rather than pass having checked nothing.
      - name: Self-check refuses a release build
        run: |
          swift build -c release -Xswiftc -warnings-as-errors
          if .build/release/diffkit-selfcheck; then
            echo "::error::diffkit-selfcheck passed in a release build, where its asserts are compiled out"
            exit 1
          fi

      - name: Build for iOS Simulator
        run: |
          xcodebuild -quiet -scheme DiffKit -destination 'generic/platform=iOS Simulator' build
          xcodebuild -quiet -scheme diffkit-preview -destination 'generic/platform=iOS Simulator' build

      # Not a pass/fail check: the rendered diffs, for a reviewer to look at.
      - name: Render harness snapshots
        run: |
          swift run diffkit-preview --snapshot snapshots/light --light
          swift run diffkit-preview --snapshot snapshots/dark --dark

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: snapshots/
